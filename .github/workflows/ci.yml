name: CI — Compile & Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compile Java sources
        run: |
          mkdir -p out
          javac -d out src/VirtualPhoneScraperSuite.java tests/VoiceCompareSuiteTest.java

      - name: Run unit tests
        run: java -cp out VoiceCompareSuiteTest

      - name: Verify data files exist
        run: |
          test -f data/virtual_phone_plans.csv && echo "✔ CSV found" || (echo "✘ CSV missing" && exit 1)
          test -f data/search_index.json       && echo "✔ JSON found" || (echo "✘ JSON missing" && exit 1)
